<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">Prediction-guided Dynamic Window Attention</title>
  <desc id="desc">A fixed sensor support produces preliminary labels. Their detached contiguous segments define the support for a second video-query to sensor-key-value attention pass, whose context is concatenated with video features for dense temporal classification.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <style>
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .head { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .body { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .token { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e3a8a; }
      .arrow { stroke: #111111; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="820" fill="#ffffff"/>
  <text x="900" y="55" text-anchor="middle" class="title">Prediction-guided Dynamic Window Attention</text>
  <text x="900" y="88" text-anchor="middle" class="subtitle">Video Q reads multiple sensor K/V tokens inside an allowed temporal support</text>

  <rect x="45" y="170" width="240" height="115" rx="16" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="165" y="215" text-anchor="middle" class="head">Video features</text>
  <text x="165" y="250" text-anchor="middle" class="body">Query at each timestep</text>

  <rect x="45" y="410" width="240" height="115" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="165" y="455" text-anchor="middle" class="head">Sensor features</text>
  <text x="165" y="490" text-anchor="middle" class="body">Aligned K/V sequence</text>

  <path d="M 285 228 L 355 228" class="arrow"/>
  <path d="M 285 468 C 325 468 320 355 355 355" class="arrow"/>

  <rect x="357" y="130" width="435" height="455" rx="20" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="574" y="174" text-anchor="middle" class="head">Round 0 · fixed local support</text>
  <text x="574" y="207" text-anchor="middle" class="body">The same neighborhood shape is used at every query.</text>

  <rect x="407" y="245" width="48" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="466" y="245" width="48" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="525" y="245" width="48" height="48" rx="8" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="584" y="245" width="48" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="643" y="245" width="48" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="431" y="276" text-anchor="middle" class="token">S−2</text>
  <text x="490" y="276" text-anchor="middle" class="token">S−1</text>
  <text x="549" y="276" text-anchor="middle" class="token">S0</text>
  <text x="608" y="276" text-anchor="middle" class="token">S+1</text>
  <text x="667" y="276" text-anchor="middle" class="token">S+2</text>
  <path d="M 549 220 L 549 243" class="arrow"/>
  <text x="549" y="216" text-anchor="middle" class="token">Q<tspan baseline-shift="sub">t</tspan></text>

  <text x="574" y="345" text-anchor="middle" class="body">Softmax weights the permitted sensor positions</text>
  <path d="M 574 365 L 574 405" class="arrow"/>
  <rect x="437" y="408" width="275" height="70" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="574" y="438" text-anchor="middle" class="head">Sensor context c0</text>
  <text x="574" y="464" text-anchor="middle" class="small">attention-weighted sum</text>
  <path d="M 574 478 L 574 514" class="arrow"/>
  <text x="574" y="548" text-anchor="middle" class="body">[video, c0] → shared MS-TCN</text>

  <path d="M 792 357 L 858 357" class="arrow"/>
  <rect x="860" y="285" width="255" height="145" rx="17" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="987" y="329" text-anchor="middle" class="head">Preliminary labels</text>
  <text x="987" y="363" text-anchor="middle" class="body">contiguous predicted</text>
  <text x="987" y="390" text-anchor="middle" class="body">action segments</text>
  <text x="987" y="416" text-anchor="middle" class="small">detached before window update</text>

  <path d="M 1115 357 L 1182 357" class="arrow"/>

  <rect x="1184" y="130" width="430" height="455" rx="20" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <text x="1399" y="174" text-anchor="middle" class="head">Round 1 · prediction-guided support</text>
  <text x="1399" y="207" text-anchor="middle" class="body">Predicted segment core plus a local margin</text>

  <rect x="1238" y="245" width="55" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="0.65"/>
  <rect x="1304" y="245" width="55" height="48" rx="8" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="1370" y="245" width="55" height="48" rx="8" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="1436" y="245" width="55" height="48" rx="8" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="1502" y="245" width="55" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity="0.65"/>
  <text x="1265" y="276" text-anchor="middle" class="token">M</text>
  <text x="1331" y="276" text-anchor="middle" class="token">C1</text>
  <text x="1397" y="276" text-anchor="middle" class="token">C2</text>
  <text x="1463" y="276" text-anchor="middle" class="token">C3</text>
  <text x="1529" y="276" text-anchor="middle" class="token">M</text>
  <path d="M 1397 220 L 1397 243" class="arrow"/>
  <text x="1397" y="216" text-anchor="middle" class="token">Q<tspan baseline-shift="sub">t</tspan></text>
  <text x="1399" y="323" text-anchor="middle" class="small">core prior 1.0 · margin prior 0.5</text>

  <text x="1399" y="365" text-anchor="middle" class="body">Softmax reweights tokens inside the new support</text>
  <path d="M 1399 384 L 1399 414" class="arrow"/>
  <rect x="1262" y="417" width="275" height="70" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="1399" y="447" text-anchor="middle" class="head">Sensor context c1</text>
  <text x="1399" y="473" text-anchor="middle" class="small">attention-weighted sum</text>
  <path d="M 1399 487 L 1399 520" class="arrow"/>
  <text x="1399" y="548" text-anchor="middle" class="body">[video, c1] → same shared MS-TCN</text>

  <path d="M 1614 357 L 1662 357" class="arrow"/>
  <rect x="1664" y="285" width="110" height="145" rx="17" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="1719" y="331" text-anchor="middle" class="head">Dense</text>
  <text x="1719" y="361" text-anchor="middle" class="head">action</text>
  <text x="1719" y="391" text-anchor="middle" class="head">labels</text>

  <rect x="245" y="655" width="1310" height="92" rx="18" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
  <text x="900" y="692" text-anchor="middle" class="head">Window = where sensor evidence may be read · Attention = how allowed positions are weighted</text>
  <text x="900" y="722" text-anchor="middle" class="body">One-way fusion: video supplies Q; aligned sensor tokens supply K and unprojected sensor values.</text>
</svg>
